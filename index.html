<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Backrooms RhythmX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Permanent+Marker&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#d8cc8a;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;filter:contrast(1.08) saturate(.92) sepia(.1) blur(.3px)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;image-rendering:pixelated}
#ov{position:fixed;inset:0;background:rgba(8,6,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;text-align:center;z-index:5}
#ov h1{margin:0;font-weight:400;font-size:clamp(34px,7vw,84px);letter-spacing:.18em;color:#d9c65a}
#ov h2{margin:0;font-weight:400;font-size:clamp(14px,2vw,22px);letter-spacing:.5em;opacity:.7}
#ov p{margin:6px 0 0;opacity:.6;font-size:14px;line-height:1.7}
#go{margin-top:18px;border:1px solid #d9c65a;padding:12px 34px;letter-spacing:.3em;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.4}}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}.hud{position:fixed;font-size:clamp(16px,2.2vw,26px);color:#eee;text-shadow:0 0 4px rgba(255,255,255,.5),1px 0 rgba(255,0,0,.5);pointer-events:none;padding:2.5vh 2.5vw;letter-spacing:.08em}.rec i{color:#f22;font-style:normal;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#cards{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;width:92%}.card{width:10%;min-width:88px;border:2px solid #d9c65a;box-shadow:0 0 14px rgba(255,210,31,.45);cursor:pointer;opacity:.7;background:#000;transition:.2s}.card.sel,.card:hover{opacity:1;box-shadow:0 0 26px rgba(255,210,31,.9)}.card img{display:block;width:100%;aspect-ratio:8/7;object-fit:cover}.card.lock{opacity:.3;filter:grayscale(1);cursor:not-allowed}.lbl{padding:.5em;font-size:15px;letter-spacing:.08em;background:#0b0a05;color:#fff3b0}#bn{color:#fff;letter-spacing:.3em;min-height:1em}
#ov h1{font-family:'Russo One',Impact,sans-serif;font-size:clamp(40px,7vw,100px);letter-spacing:.03em;background:repeating-linear-gradient(90deg,#ffe96a,#ffc800 6px,#fff3a0 9px);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,0,.55));line-height:.95}
#ov h2{font-family:'Permanent Marker',cursive;font-size:clamp(28px,4.4vw,64px);letter-spacing:0;opacity:1;color:#ffd21f;transform:rotate(-4deg);text-shadow:0 0 10px rgba(255,180,0,.6);margin-top:-1vw}
#go,.sb{font-family:Rajdhani,'Courier New',sans-serif;font-weight:700;color:#fff3b0;background:rgba(0,0,0,.6);border:2px solid #ffd21f;border-radius:4px;box-shadow:0 0 14px rgba(255,210,31,.55),inset 0 0 10px rgba(255,210,31,.15);cursor:pointer;animation:none}
#go{font-size:clamp(16px,1.9vw,26px);padding:.7em 2.6em;margin-top:1vh;letter-spacing:.1em}.sb{font-size:clamp(12px,1.2vw,16px);padding:.6em 2.6em;letter-spacing:.1em}#go:hover,.sb:hover{background:rgba(70,55,0,.7);box-shadow:0 0 26px rgba(255,210,31,.95)}
.row{display:flex;gap:2vw}.card{border-radius:4px}
#set{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);align-items:center;justify-content:center;font-family:Rajdhani,sans-serif}.pn{border:2px solid #ffd21f;background:#0b0a05;padding:26px 34px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 30px rgba(255,210,31,.5);color:#fff3b0;font-size:18px}
.novhs #scan,.novhs .hud,.novhs #grain{display:none}
#card{position:fixed;left:0;right:0;bottom:14vh;text-align:center;letter-spacing:.4em;font-size:clamp(14px,2vw,24px);opacity:0;pointer-events:none;text-shadow:0 0 8px #000}
#card.show{animation:fo 7s ease-in-out forwards}
@keyframes fo{0%{opacity:0}20%,70%{opacity:.85}100%{opacity:0}}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><canvas id="grain" width="128" height="72"></canvas><div id="card">LEVEL 0 · THE LOBBY</div>
<div id="code" style="display:none;position:fixed;top:2.5vh;right:2.5vw;z-index:6;font:700 20px 'Courier New',monospace;border:2px solid #ccc;background:rgba(0,0,0,.65);padding:8px 14px;color:#e8e8e8;letter-spacing:.2em"></div>
<div id="hint" style="position:fixed;bottom:9vh;left:0;right:0;text-align:center;font:600 20px Rajdhani,sans-serif;color:#fff;text-shadow:0 1px 4px #000;z-index:6;pointer-events:none"></div>
<div id="xh" style="display:none;position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);z-index:6"></div>
<div id="sbar" style="display:none;position:fixed;bottom:3vh;left:50%;transform:translateX(-50%);width:180px;height:5px;background:rgba(255,255,255,.15);z-index:6"><div id="stam" style="height:100%;width:100%;background:#ddd"></div></div>
<div id="fl" style="position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7"></div>
<div id="scan"></div><div class="hud rec" style="top:0;left:0"><i>●</i> REC <span id="tc">00:00:00</span></div><div class="hud" style="top:0;right:0">▮▮▮▯ SP</div><div class="hud" id="stamp" style="bottom:0;left:0"></div>
<div id="ov"><h1>BACKROOMS</h1><h2>RhythmX</h2><div id="bn"></div><div id="cards"></div><div id="go">ENTER THE BACKROOMS</div><div class="row"><div class="sb" id="set1">SETTINGS</div><div class="sb" id="qt">QUIT</div></div></div>
